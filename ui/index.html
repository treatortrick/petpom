<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>petpom</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; cursor:default; }
  html, body { background:transparent; overflow:hidden; width:100%; height:100%; font-family:-apple-system,"PingFang SC",sans-serif; }

  #stage { position:relative; width:100vw; height:100vh; }

  /* ===== 宠物 ===== */
  #pet { position:absolute; left:18px; bottom:21px; width:192px; height:192px;
         image-rendering:pixelated; cursor:grab; }
  #pet:active { cursor:grabbing; }
  /* 程序补间层：关键姿势之间的连续运动（呼吸/摇摆/回弹）都在这一层做，帧只负责形变 */
  #pet .motion { position:absolute; inset:0; transform-origin:50% 100%; will-change:transform; }
  /* 状态容器：切换状态时交叉淡入 120ms，不再硬切（跳变感来源） */
  #pet .anim { position:absolute; inset:0; opacity:0; transition:opacity .12s linear; }
  #pet .anim.on { opacity:1; }
  #pet .anim.fading { opacity:0; }
  /* 帧图 pointer-events:none：交互全部由 #stage 承接，
     且从结构上杜绝 WebKit 原生图片拖拽（img 默认 draggable，
     一旦被拖走 pointer 流会被 pointercancel 打断、窗口拖拽失效，
     丢到桌面还会被存成 PNG 文件） */
  #pet img.frame { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:none;
                   image-rendering:pixelated; pointer-events:none; -webkit-user-drag:none; }
  #pet img.frame.on { display:block; }

  /* 探险带回的卡片（P：温和期待型的核心反馈时刻）
     出现在宠物上方，约 7 秒淡出；期间时间牌避让 */
  #card-pop { position:absolute; left:114px; top:2px; width:228px; padding:8px 11px 9px;
              background:rgba(255,253,247,.97); border:1px solid #f0e6d2; border-radius:13px;
              box-shadow:0 8px 22px rgba(90,70,40,.14);
              opacity:0; transform:translateX(-50%) translateY(-8px) scale(.97);
              transition:opacity .26s ease, transform .26s cubic-bezier(.2,.9,.3,1);
              pointer-events:none; }
  #card-pop.show { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  #card-pop .c-rarity { font-size:11px; color:#b08a56; letter-spacing:.5px; }
  #card-pop .c-name { font-size:14px; font-weight:500; color:#4a4238; margin:2px 0 4px; }
  #card-pop .c-text { font-size:12px; line-height:1.55; color:#6b6357; }
  #card-pop .c-foot { margin-top:7px; padding-top:6px; border-top:1px dashed #f0ead9;
                      font-size:11px; color:#a89f90; }
  #card-pop.rare .c-rarity { color:#c2703a; }
  #card-pop.rare { border-color:#f0d9b8; }

  /* 出门期间桌宠淡出：窗口本身是透明的，桌面上不留痕迹 */
  #pet { transition:opacity .55s ease; }
  #pet.away { opacity:0; }
  @media (prefers-reduced-motion: reduce) { #pet { transition:none; } }

  /* 提醒态：窗口向左扩（右缘对齐），宠物固定在大窗口右侧，
     这样「弹提醒」时宠物不会横跳（765-18-192=555）。 */
  #stage.alerting #pet { left:555px; }
  #stage.alerting #bubble { left:651px; }
  #stage.alerting #card-pop { left:651px; }
  #stage.alerting #timer-badge { display:none; }

  /* ===== 程序补间动作（幅度克制，避免与帧动画打架） ===== */
  @keyframes mBreath { 0%,100% { transform:scale(1,1) translateY(0); } 50% { transform:scale(1.008,1.022) translateY(0); } }
  @keyframes mDoze   { 0%,100% { transform:scale(1,1); } 50% { transform:scale(1.012,1.035); } }
  @keyframes mSway   { 0%,100% { transform:rotate(-1.6deg) translateY(1px); } 50% { transform:rotate(1.6deg) translateY(-1px); } }
  @keyframes mBounce { 0% { transform:translateY(0) scale(1,1); } 25% { transform:translateY(-6px) scale(.99,1.03); }
                       55% { transform:translateY(0) scale(1.03,.97); } 75% { transform:translateY(-2px) scale(1,1); }
                       100% { transform:translateY(0) scale(1,1); } }
  @keyframes mPress  { 0% { transform:scale(1,1); } 35% { transform:scale(1.035,.965); }
                       70% { transform:scale(.995,1.015); } 100% { transform:scale(1,1); } }
  .m-breath { animation:mBreath 3.4s ease-in-out infinite; }
  .m-doze   { animation:mDoze 4.6s ease-in-out infinite; }
  .m-sway   { animation:mSway .62s ease-in-out infinite; }
  .m-bounce { animation:mBounce .62s cubic-bezier(.2,.8,.3,1) 1; }
  .m-press  { animation:mPress .5s ease-out 1; }

  /* ===== 气泡 ===== */
  #bubble { position:absolute; left:114px; bottom:153px; max-width:232px;
            background:rgba(255,253,247,.97); border:1px solid #ece0cd; border-radius:14px;
            padding:7px 12px; font-size:13px; color:#6b6357; line-height:1.55;
            box-shadow:0 4px 14px rgba(60,50,30,.13); opacity:0;
            transform:translateX(-50%) translateY(6px);
            transition:opacity .18s ease, transform .18s ease; pointer-events:none; }
  #bubble.show { opacity:1; transform:translateX(-50%) translateY(0); }
  /* 尾巴：底部中线指向宠物头顶（气泡与宠物同轴在 x=114，所以尾巴天然对准头顶） */
  #bubble::after { content:""; position:absolute; left:50%; bottom:-6px; margin-left:-5px;
                   width:10px; height:10px; background:rgba(255,253,247,.97);
                   border-right:1px solid #ece0cd; border-bottom:1px solid #ece0cd;
                   transform:rotate(45deg); }
  /* 时间牌可见时气泡上移让位（两者不抢同一块空间） */
  #bubble.up { bottom:181px; }

  /* ===== 提醒胶囊 ===== */
  #pill { position:absolute; right:15px; bottom:21px; width:330px;
          background:#fff; border:1px solid #e8e0d2; border-radius:16px;
          box-shadow:0 10px 30px rgba(60,50,30,.18); padding:13px 15px;
          opacity:0; transform:translateY(14px) scale(.97); pointer-events:none;
          transition:opacity .22s ease, transform .22s cubic-bezier(.2,.9,.3,1.2); }
  #pill.show { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  #pill h4 { font-size:15px; color:#3d3833; margin-bottom:2px; }
  #pill .ptext { font-size:12.5px; color:#8a8378; margin-bottom:10px; line-height:1.5; }
  #pill .pbtns { display:flex; gap:8px; }
  .pbtn { flex:1; text-align:center; font-size:12.5px; padding:8px 4px; border-radius:9px;
          border:1px solid #e8e0d2; color:#555; background:#faf7f0; cursor:pointer; white-space:nowrap; }
  .pbtn:hover { background:#f3ede1; }
  .pbtn.main { background:#e8975a; border-color:#e8975a; color:#fff; font-weight:600; }
  .pbtn.main:hover { background:#dd8a4c; }
  .pbtn.snooze { background:#fdeedd; border-color:#f2d9b8; color:#b06a2a; }
  .pbtn.snooze:hover { background:#fae3c6; }
  #pill .countdown { font-size:11px; color:#c9c0af; margin-top:8px; text-align:right; }

  /* ===== Zzz 粒子（focus 态运行时叠加） ===== */
  .zzz { position:absolute; font-size:14px; color:#a89f90; font-weight:600; pointer-events:none;
         animation:zzzFloat 2.4s ease-out forwards; }
  @keyframes zzzFloat {
    0%   { opacity:0; transform:translate(0,0) scale(.7); }
    15%  { opacity:.9; }
    100% { opacity:0; transform:translate(26px,-46px) scale(1.25); }
  }

  /* ===== toast（本轮失效等提示） ===== */
  #toast { position:absolute; left:50%; top:16px; transform:translateX(-50%);
           background:#fff; border:1px solid #e8e0d2; border-radius:10px; padding:8px 14px;
           font-size:13px; color:#8a6a2a; box-shadow:0 6px 18px rgba(60,50,30,.15);
           opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
  #toast.show { opacity:1; }

  /* ===== 头顶时间牌（2026-09-30 改版）=====
     改成「米白细描边挂件 + 状态圆点」，并下移到紧贴宠物头顶上方 10px（宠物中心 x=114）。
     状态语义：专注=橙色呼吸点 / 休息=青绿点 / 暂停=灰点不动 / 最后 60 秒=红点快闪。
     旧版是整块高饱和橙色实心胶囊——视觉权重比宠物还大，且离头顶 73px，像另一个东西。 */
  #timer-badge { position:absolute; bottom:153px; left:114px;
           transform:translateX(-50%) translateY(4px);
           display:flex; align-items:center; gap:7px; padding:4px 12px 4px 10px;
           border-radius:999px; background:rgba(255,253,247,.97);
           border:1px solid #ece0cd; color:#5f584d;
           box-shadow:0 3px 10px rgba(70,55,35,.10);
           opacity:0; pointer-events:none; white-space:nowrap; cursor:pointer;
           transition:opacity .22s ease, transform .22s ease; }
  #timer-badge.on { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  #timer-badge.duck { opacity:0; transform:translateX(-50%) translateY(4px); pointer-events:none; }
  #timer-badge .dot { width:6px; height:6px; border-radius:50%; background:#e8975a; flex:0 0 auto; }
  #timer-badge .t-label { font-size:11px; color:#a0968a; }
  #timer-badge .t-time { font-size:12.5px; font-weight:500; color:#4a4238;
                         font-variant-numeric:tabular-nums; letter-spacing:.3px; }
  @keyframes badgeDot {
    0%,100% { opacity:1; transform:scale(1); }
    50%     { opacity:.4; transform:scale(.8); }
  }
  #timer-badge.run .dot { animation:badgeDot 2s ease-in-out infinite; }
  #timer-badge.rest .dot { background:#6fb5a0; }
  #timer-badge.paused .dot { background:#b3aa9c; }
  #timer-badge.paused .t-time { color:#8d857a; }
  #timer-badge.urgent .dot { background:#d9534f; animation-duration:.9s; }
  #timer-badge.urgent .t-time { color:#c0392b; }

  /* 开小差第 3 档：时间牌闪三下 + 轻微放大，把「暂停」出口指出来。
     注意：必须同时覆盖 .duck 的隐藏（气泡出现时牌会避让），否则闪了也看不见 */
  @keyframes badgeHint {
    0%, 100% { transform:translateX(-50%) scale(1); box-shadow:0 4px 12px rgba(60,50,30,.16); }
    50%      { transform:translateX(-50%) scale(1.08); box-shadow:0 0 0 7px rgba(232,151,90,.35), 0 4px 14px rgba(60,50,30,.2); }
  }
  #timer-badge.hint { animation:badgeHint .85s ease-in-out 3; opacity:1; pointer-events:auto; }
  /* 指引期间气泡上移让位，避免压住时间牌 */
  #bubble.lift { bottom:266px; }

  /* ===== 完成结算卡（P0-1）：一轮专注确认结束后的正反馈，约 5 秒淡出 ===== */
  #settle { position:absolute; left:50%; top:10px; width:236px;
            transform:translateX(-50%) translateY(-6px) scale(.97);
            background:#fff; border:1px solid #e8e0d2; border-radius:14px;
            box-shadow:0 8px 24px rgba(60,50,30,.16); padding:11px 14px;
            opacity:0; pointer-events:none;
            transition:opacity .22s ease, transform .22s cubic-bezier(.2,.9,.3,1.2); }
  #settle.show { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  #settle .s-top { font-size:11.5px; color:#a89f90; letter-spacing:.3px; }
  #settle .s-main { display:flex; align-items:baseline; gap:6px; margin:3px 0 5px; }
  #settle .s-main b { font-size:22px; font-weight:700; color:#e8975a; line-height:1.1; }
  #settle .s-main span { font-size:12px; color:#8a8378; }
  #settle .s-sub { font-size:12px; color:#6b6357; }
  #settle .s-tail { margin-top:6px; padding-top:6px; border-top:1px dashed #f0ead9;
                    font-size:11.5px; color:#b06a2a; }

  /* ===== 无障碍：系统「减少动态效果」时退化为静帧，停掉装饰性动效 ===== */
  @media (prefers-reduced-motion: reduce) {
    #pet .motion { animation:none !important; }
    #timer-badge.hint { animation:none; }
    #timer-badge .dot { animation:none !important; }
    .zzz { display:none; }
    #timer-badge, #bubble, #pill, #settle, #card-pop, #pet .anim { transition:none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="settle"></div>
  <div id="card-pop"></div>
  <div id="timer-badge"><span class="dot"></span><span class="t-label">专注中</span><span class="t-time">00:00</span></div>
  <div id="bubble"></div>
  <div id="pet"><div class="motion"></div></div>
  <div id="pill">
    <h4 id="pill-title"></h4>
    <div class="ptext" id="pill-text"></div>
    <div class="pbtns" id="pill-btns"></div>
    <div class="countdown" id="pill-countdown"></div>
  </div>
  <div id="toast"></div>
</div>
<script src="pet.js"></script>
</body>
</html>
